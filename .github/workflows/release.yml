name: release

on:
  push:
    tags: ["v*"]
  # Handy for checking the matrix still builds without cutting a release.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Apple runner builds both architectures: the macOS SDK is
          # universal, so the x86_64 slice cross-compiles fine on Apple silicon.
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          # musl targets link statically, so these run anywhere with a Linux
          # kernel — no libc to match, no loader.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          # Free arm64 runners exist for public repos. If that ever changes,
          # build this one with cargo-zigbuild on an x86 runner instead.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `ring` compiles C, and a static musl binary needs musl's libc.a.
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target="${{ matrix.target }}"
          # cc-rs reads the triple lower-cased with underscores, cargo wants it
          # upper-cased. Same compiler, two spellings.
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_$(echo "$target" | tr 'a-z-' 'A-Z_')_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          staging="ahole-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/ahole" "$staging/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - uses: actions/upload-artifact@v4
        with:
          name: ahole-${{ matrix.target }}
          path: ahole-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Static Linux binaries (x86_64, arm64) and macOS binaries (Apple
            silicon, Intel).

            macOS marks downloaded binaries as quarantined and this one is not
            signed by a paid developer account, so run
            `xattr -d com.apple.quarantine ahole` once after unpacking.
